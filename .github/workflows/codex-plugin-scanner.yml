name: Codex Plugin Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: codex-plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Codex plugin scanner
        uses: hashgraph-online/hol-codex-plugin-scanner-action@4c3daabf5f4c03212265c4a4e98bbd5655fd2190 # v1
        with:
          plugin_dir: "."
