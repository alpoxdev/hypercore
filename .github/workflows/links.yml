name: Source Links

# External link status changes independently of pull requests, so this check
# runs on a schedule instead of blocking merges.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: source-links
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Check instruction sources (strict, with links)
        run: bash scripts/check-sources.sh --strict
