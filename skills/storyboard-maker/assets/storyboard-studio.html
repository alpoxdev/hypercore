<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스토리보드 스튜디오</title>
<style>
:root{color-scheme:light;--ink:#111;--muted:#5f5a52;--line:#d9d4ca;--paper:#fbfaf6;--accent:#c0392b;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;padding:24px;max-width:1520px;margin-inline:auto;line-height:1.5}
header.board-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:24px;margin:0}
.board-head p{margin:0;color:var(--muted);font-size:14px}
#status{min-height:1.8em;overflow-wrap:anywhere;font-size:14px;margin:4px 0 16px;color:var(--muted)}
#status[data-error="true"]{color:#a41414;font-weight:600}
#editor[hidden]{display:none}
#editor{margin-bottom:20px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#fff}
#editor label{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:260px;padding:12px;font:13px/1.5 ui-monospace,"SFMono-Regular",Menlo,monospace;border:1px solid #999;border-radius:6px;background:#fff;color:var(--ink)}
button{font:inherit;min-height:44px;padding:10px 18px;margin-top:8px;border:1px solid #666;border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
textarea:focus-visible,button:focus-visible{outline:3px solid #2474b8;outline-offset:3px}
#output{display:block}
.scene-board{margin:0 0 30px}
.scene-board h2{font-size:18px;margin:0 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.floorplan{margin:0 0 12px;max-width:520px}
.floorplan svg{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
.floorplan figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.page{margin:0 0 18px}
.page-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:8px}
.panel-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
article.panel{margin:0;border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px;min-width:0}
.panel-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12px;font-weight:600;margin-bottom:4px}
.panel-head .scene-line{overflow-wrap:anywhere}
.size-chip{flex:none;border:1px solid var(--ink);border-radius:3px;padding:0 5px;font-size:11px;letter-spacing:.04em}
.panel-svg{width:100%;height:auto;display:block;background:#fff}
.panel-svg text{font-family:inherit;font-size:22px;fill:#111}
.panel-svg .move-label{font-size:30px;font-weight:700;fill:#c0392b}
.panel-svg .hint-text{font-size:17px;fill:#5f5a52}
.panel-notes{font-size:12px;line-height:1.45;margin-top:6px}
.panel-notes p{margin:0 0 3px;overflow-wrap:anywhere}
.camera-line{color:var(--muted)}
.action{font-weight:600}
.dialogue b{font-weight:700}
.sound{color:var(--muted);font-style:italic}
.shot-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted)}
.badge{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:0 4px;font-size:10px;font-weight:700;letter-spacing:.03em}
.board-summary{font-size:13px;color:var(--muted);margin:0 0 14px}
@media(max-width:760px){body{padding:14px}.panel-grid{grid-template-columns:1fr}}
@media print{
  :root{background:#fff}
  body{padding:0;max-width:none}
  header.board-head,#status,#editor,.board-summary{display:none}
  .scene-board h2{font-size:13pt}
  .floorplan{max-width:100%}
  .page{break-after:page}
  .page:last-child{break-after:auto}
  .panel-grid{grid-template-columns:repeat(var(--per-page,3),1fr);gap:6mm}
  article.panel{break-inside: avoid; page-break-inside: avoid; padding:2mm; border:1px solid #999}
  .panel-notes{font-size:7pt}
  .panel-svg text{font-size:20px}
}
@page { size: A4 landscape; margin: 12mm }
</style>
</head>
<body>
<header class="board-head">
  <h1>스토리보드 스튜디오</h1>
  <p>카메라 숫자에서 계산한 선화 패널, 이동 표기, 씬 평면도입니다. 오류가 있으면 패널을 그리지 않습니다.</p>
</header>
<p id="status" role="status" aria-live="polite"></p>
<section id="editor" aria-label="문서 붙여넣기" hidden>
  <label for="input">스토리보드 문서(JSON)</label>
  <textarea id="input" spellcheck="false" aria-describedby="editor-hint"></textarea>
  <p id="editor-hint">문서 전체를 붙여넣고 렌더를 누르십시오. 값이 바뀌면 다시 렌더해야 반영됩니다.</p>
  <button id="render" type="button">렌더</button>
</section>
<main id="output" aria-label="스토리보드"></main>
<script type="application/json" id="storyboard-doc"></script>
<script id="storyboard-core">
"use strict";
var StoryboardCore = (function () {
  var D2R = Math.PI / 180, R2D = 180 / Math.PI;
  var ASPECTS = { "16:9": 16 / 9, "2.39:1": 2.39, "1.85:1": 1.85, "4:3": 4 / 3, "9:16": 9 / 16 };
  var SIZE_ENUM = ["ECU", "CU", "MCU", "MS", "COWBOY", "MWS", "FS", "WS", "ELS", "OTS"];
  var POSE_ENUM = ["stand", "walk", "sit", "reach", "crouch"];
  var MOVE_ENUM = ["STATIC", "PAN L", "PAN R", "TILT UP", "TILT DOWN", "PUSH IN", "PULL OUT", "ZOOM IN", "ZOOM OUT", "DOLLY IN", "DOLLY OUT", "TRUCK L", "TRUCK R", "PED UP", "PED DOWN", "CRANE UP", "CRANE DOWN", "ROLL L", "ROLL R", "HANDHELD"];
  var TRANSITION_ENUM = ["CUT", "DISSOLVE", "FADE IN", "FADE OUT", "WIPE", "SMASH CUT", "MATCH CUT"];
  var CROSS_ENUM = ["neutral", "subject-move", "camera-move", "both", "none"];
  var PROVENANCE_ENUM = ["generated", "supplied"];
  var IMAGE_SRC_RE = /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/;
  var DEFAULT_STYLE = "grayscale manga storyboard line art, clean ink lines, 2-3 flat gray tones, no text, no speech bubbles";
  var SIZE_EN = {
    ECU: "extreme close-up", CU: "close-up", MCU: "medium close-up", MS: "medium shot",
    COWBOY: "cowboy shot", MWS: "medium wide shot", FS: "full shot", WS: "wide shot",
    ELS: "extreme wide shot", OTS: "over-the-shoulder shot"
  };
  var ANGLE_EN = { "EYE LEVEL": "eye level", HIGH: "high angle", LOW: "low angle", OVERHEAD: "overhead", "WORM'S EYE": "worm's eye" };
  var GUIDE_TONE = { ink: "#8a8a8a", accent: "#8a8a8a", fill: "#f4f4f4", width: 1.4, hair: "#c4c4c4" };
  var IN_MOVES = { "PUSH IN": 1, "ZOOM IN": 1, "DOLLY IN": 1 };
  var OUT_MOVES = { "PULL OUT": 1, "ZOOM OUT": 1, "DOLLY OUT": 1 };
  var FRAME_RANGES = {
    ECU: [0.90, 0.98], CU: [0.80, 1.02], MCU: [0.70, 1.02], MS: [0.52, 1.03],
    COWBOY: [0.40, 1.04], MWS: [0.28, 1.05], FS: [-0.03, 1.06]
  };
  var ANGLE_KO = { "EYE LEVEL": "아이레벨", HIGH: "부감", LOW: "앙각", OVERHEAD: "오버헤드", "WORM'S EYE": "웜즈아이" };
  var YAW_KO = { FRONT: "정면", "3/4": "3/4", PROFILE: "측면", "3/4 BACK": "3/4 뒷모습", BACK: "뒷모습" };
  var HEIGHT_KO = { GROUND: "지면", KNEE: "무릎", HIP: "허리", SHOULDER: "어깨", EYE: "눈높이", ABOVE: "머리 위" };
  var VBW = 1600;

  // ------------------------------------------------------------------ utils
  function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function isStr(v) { return typeof v === "string" && v.trim() !== ""; }
  function isArr(v) { return Array.isArray(v); }
  function numOr(v, d) { return isNum(v) ? v : d; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function fx(v, d) { var p = Math.pow(10, d); return (Math.round(v * p) / p).toFixed(d); }
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function hashId(s) {
    var h = 2166136261, i;
    for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function sub3(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
  function dot3(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
  function cross3(a, b) { return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x }; }
  function len3(a) { return Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z); }
  function norm3(a) { var l = len3(a) || 1; return { x: a.x / l, y: a.y / l, z: a.z / l }; }
  function dist3(a, b) { return len3(sub3(a, b)); }
  function aspectValue(aspect) { return ASPECTS[aspect] || 16 / 9; }

  // --------------------------------------------------------------- geometry
  function vfovDeg(focalMm, aspect, sensorLongMm) {
    var ratio = aspectValue(aspect);
    var sensor = isNum(sensorLongMm) ? sensorLongMm : 35;
    var axis = ratio >= 1 ? sensor / ratio : sensor;
    return 2 * Math.atan(axis / (2 * focalMm)) * R2D;
  }

  function aspectOf(doc) { return ASPECTS[doc.aspect] ? doc.aspect : "16:9"; }
  function sensorOf(doc) { return numOr(doc.sensorLongMm, 35); }
  function perPageOf(doc) { return numOr(doc.panelsPerPage, 3); }

  function findScene(doc, sceneId) {
    var i;
    if (!doc || !isArr(doc.scenes)) return null;
    for (i = 0; i < doc.scenes.length; i++) if (isObj(doc.scenes[i]) && doc.scenes[i].id === sceneId) return doc.scenes[i];
    return null;
  }
  function findShot(scene, shotId) {
    var i;
    if (!scene || !isArr(scene.shots)) return null;
    for (i = 0; i < scene.shots.length; i++) if (isObj(scene.shots[i]) && scene.shots[i].id === shotId) return scene.shots[i];
    return null;
  }
  function charOf(doc, id) {
    var i;
    if (!doc || !isArr(doc.characters)) return null;
    for (i = 0; i < doc.characters.length; i++) if (isObj(doc.characters[i]) && doc.characters[i].id === id) return doc.characters[i];
    return null;
  }
  function propOf(scene, id) {
    var i;
    if (!scene || !isArr(scene.props)) return null;
    for (i = 0; i < scene.props.length; i++) if (isObj(scene.props[i]) && scene.props[i].id === id) return scene.props[i];
    return null;
  }
  function blockingOf(doc, scene, shot, id) {
    var i, b, list;
    if (shot && isArr(shot.blockingOverride)) {
      for (i = 0; i < shot.blockingOverride.length; i++) {
        b = shot.blockingOverride[i];
        if (isObj(b) && b.character === id) return b;
      }
    }
    list = scene && isArr(scene.blocking) ? scene.blocking : [];
    for (i = 0; i < list.length; i++) {
      b = list[i];
      if (isObj(b) && b.character === id) return b;
    }
    return null;
  }
  function positionOf(doc, scene, shot, id) {
    var ch = charOf(doc, id), b, prop;
    if (ch) {
      b = blockingOf(doc, scene, shot, id);
      return b ? { x: numOr(b.x, 0), z: numOr(b.z, 0) } : { x: 0, z: 0 };
    }
    prop = propOf(scene, id);
    return prop ? { x: numOr(prop.x, 0), z: numOr(prop.z, 0) } : { x: 0, z: 0 };
  }
  function facingOf(doc, scene, shot, id) {
    if (!charOf(doc, id)) return 0;
    var b = blockingOf(doc, scene, shot, id);
    return b ? numOr(b.facingDeg, 0) : 0;
  }
  function poseOf(doc, scene, shot, id) {
    var b = blockingOf(doc, scene, shot, id);
    return b && POSE_ENUM.indexOf(b.pose) >= 0 ? b.pose : "stand";
  }
  function subjectsOf(doc, scene, shot) {
    if (isArr(shot.subjects)) return shot.subjects;
    return charOf(doc, shot.focus) ? [shot.focus] : [];
  }

  function characterSpan(size, H) {
    var r;
    if (size === "WS") return [-0.5 * H, 1.5 * H];
    if (size === "ELS") return [-1.5 * H, 2.5 * H];
    if (size === "OTS" || !FRAME_RANGES[size]) r = FRAME_RANGES.MCU;
    else r = FRAME_RANGES[size];
    return [r[0] * H, r[1] * H];
  }

  function framingBox(doc, scene, shot, sizeOverride) {
    var size = sizeOverride || shot.size;
    var boxes = [], bottom = Infinity, top = -Infinity, i;
    var focusChar = charOf(doc, shot.focus);
    if (focusChar) boxes.push(characterSpan(size, numOr(focusChar.heightM, 1.7)));
    else {
      var prop = propOf(scene, shot.focus);
      var propH = prop ? numOr(prop.h, 1) : 1.7;
      var propCentre = prop ? numOr(prop.y, 0) + propH / 2 : propH / 2;
      boxes.push([propCentre - propH * 0.8, propCentre + propH * 0.8]);
    }
    var subs = subjectsOf(doc, scene, shot);
    for (i = 0; i < subs.length; i++) {
      if (subs[i] === shot.focus) continue;
      var c = charOf(doc, subs[i]);
      if (c) boxes.push(characterSpan(size, numOr(c.heightM, 1.7)));
    }
    for (i = 0; i < boxes.length; i++) {
      if (boxes[i][0] < bottom) bottom = boxes[i][0];
      if (boxes[i][1] > top) top = boxes[i][1];
    }
    return { bottom: bottom, top: top, height: top - bottom, center: (top + bottom) / 2 };
  }

  function cameraFrame(camPos, target, rollDeg) {
    var forward = norm3(sub3(target, camPos));
    var zaxis = { x: -forward.x, y: -forward.y, z: -forward.z };
    var up = { x: 0, y: 1, z: 0 };
    var xaxis = cross3(up, zaxis);
    if (len3(xaxis) < 1e-6) {
      up = { x: 0, y: 0, z: forward.y > 0 ? -1 : 1 };
      xaxis = cross3(up, zaxis);
    }
    xaxis = norm3(xaxis);
    var yaxis = norm3(cross3(zaxis, xaxis));
    var r = (rollDeg || 0) * D2R;
    if (r) {
      var c = Math.cos(r), s = Math.sin(r);
      var nx = { x: xaxis.x * c + yaxis.x * s, y: xaxis.y * c + yaxis.y * s, z: xaxis.z * c + yaxis.z * s };
      var ny = { x: -xaxis.x * s + yaxis.x * c, y: -xaxis.y * s + yaxis.y * c, z: -xaxis.z * s + yaxis.z * c };
      xaxis = nx; yaxis = ny;
    }
    return { forward: forward, right: xaxis, up: yaxis };
  }

  function project(view, p) {
    var d = sub3(p, view.camPos);
    var depth = dot3(d, view.frame.forward);
    if (depth <= 0.05) return null;
    var nx = dot3(d, view.frame.right) / (depth * view.tanH);
    var ny = dot3(d, view.frame.up) / (depth * view.tanV);
    return { x: (nx * 0.5 + 0.5) * view.W, y: (0.5 - ny * 0.5) * view.H, depth: depth };
  }

  function cameraOf(doc, scene, shot) {
    var aspect = aspectOf(doc);
    var vfov = vfovDeg(shot.camera.focalMm, aspect, sensorOf(doc));
    var tanV = Math.tan(vfov / 2 * D2R);
    var tanH = tanV * aspectValue(aspect);
    var box = framingBox(doc, scene, shot, null);
    var fp = positionOf(doc, scene, shot, shot.focus);
    var target = { x: fp.x, y: box.center, z: fp.z };
    var cam = shot.camera, camPos, distanceM, i;
    if (cam.pov) {
      var pvPos = positionOf(doc, scene, shot, cam.pov);
      var pv = charOf(doc, cam.pov);
      camPos = { x: pvPos.x, y: numOr(pv.heightM, 1.7) * 0.94, z: pvPos.z };
      distanceM = dist3(camPos, target);
    } else if (shot.size === "OTS") {
      var ovPos = positionOf(doc, scene, shot, cam.over);
      var ov = charOf(doc, cam.over);
      var dx = target.x - ovPos.x, dz = target.z - ovPos.z;
      var dl = Math.hypot(dx, dz) || 1;
      var ux = dx / dl, uz = dz / dl;
      var rx = -uz, rz = ux;
      // 0.35 m behind the shoulder, then as far to the side as the frame allows
      // so the near shoulder edge stays visible instead of being cropped away.
      var overHalfW = 0.115 * numOr(ov.heightM, 1.7);
      var lateral = Math.min(0.35, overHalfW + 0.80 * 0.35 * tanH);
      camPos = {
        x: ovPos.x - ux * 0.35 + rx * lateral,
        y: numOr(ov.heightM, 1.7) * 0.835,
        z: ovPos.z - uz * 0.35 + rz * lateral
      };
      distanceM = dist3(camPos, target);
    } else {
      distanceM = isNum(cam.distanceM) ? cam.distanceM : (box.height / 2) / tanV;
      var pitch;
      if (isNum(cam.pitchDeg)) pitch = cam.pitchDeg * D2R;
      else if (isNum(cam.heightM)) pitch = Math.asin(clamp((cam.heightM - box.center) / distanceM, -1, 1));
      else pitch = 0;
      var az = (facingOf(doc, scene, shot, shot.focus) + numOr(cam.yawDeg, 0)) * D2R;
      camPos = {
        x: target.x + distanceM * Math.cos(pitch) * Math.sin(az),
        y: target.y + distanceM * Math.sin(pitch),
        z: target.z + distanceM * Math.cos(pitch) * Math.cos(az)
      };
    }
    var heightM = camPos.y;
    var pitchDeg = Math.asin(clamp((camPos.y - target.y) / distanceM, -1, 1)) * R2D;
    var frame = cameraFrame(camPos, target, numOr(cam.rollDeg, 0));
    var view = { W: VBW, H: Math.round(VBW / aspectValue(aspect)), tanH: tanH, tanV: tanV, camPos: camPos, frame: frame, target: target };
    var grid = groundSegments(view, target);
    return {
      camPos: camPos, target: target, targetPoint: target, box: box,
      distanceM: distanceM, vfovDeg: vfov, tanV: tanV, tanH: tanH,
      pitchDeg: pitchDeg, heightM: heightM, frame: frame, view: view,
      horizonVisible: Math.abs(pitchDeg) < vfov / 2,
      groundVisible: grid.length > 0,
      facingScreen: facingScreenOf(doc, shot),
      angleName: angleNameOf(pitchDeg, heightM),
      yawName: yawNameOf(numOr(cam.yawDeg, 0)),
      heightName: heightNameOf(heightM)
    };
  }

  function facingScreenOf(doc, shot) {
    if (!charOf(doc, shot.focus)) return "center";
    var s = Math.sin(numOr(shot.camera.yawDeg, 0) * D2R);
    if (Math.abs(s) < 0.1) return "center";
    return s > 0 ? "left" : "right";
  }
  function angleNameOf(pitch, heightM) {
    if (pitch >= 75) return "OVERHEAD";
    if (pitch <= -75 || heightM <= 0.3) return "WORM'S EYE";
    if (pitch > 5) return "HIGH";
    if (pitch < -5) return "LOW";
    return "EYE LEVEL";
  }
  function yawNameOf(yaw) {
    var a = Math.abs(yaw), name;
    if (a <= 15) name = "FRONT";
    else if (a <= 60) name = "3/4";
    else if (a <= 120) name = "PROFILE";
    else if (a <= 165) name = "3/4 BACK";
    else name = "BACK";
    if (a > 0.0001) name += yaw > 0 ? " L" : " R";
    return name;
  }
  function heightNameOf(h) {
    if (h < 0.3) return "GROUND";
    if (h < 0.7) return "KNEE";
    if (h < 1.1) return "HIP";
    if (h < 1.45) return "SHOULDER";
    if (h < 1.75) return "EYE";
    return "ABOVE";
  }

  // ------------------------------------------------------------- validation
  function issue(code, path, message) { return { code: code, path: path, message: message }; }

  function validate(doc) {
    var errors = [], info = [];
    function err(code, path, message) { errors.push(issue(code, path, message)); }

    if (!isObj(doc)) { err("SCHEMA_TYPE", "$", "문서는 JSON 객체여야 합니다."); return { errors: errors, info: info }; }
    if (doc.version === undefined || doc.version === null) err("SCHEMA_REQUIRED", "version", "version이 필요합니다.");
    else if (doc.version !== 1) err("SCHEMA_TYPE", "version", "version은 숫자 1이어야 합니다.");
    if (!isStr(doc.title)) err("SCHEMA_REQUIRED", "title", "title이 필요합니다.");
    if (doc.aspect !== undefined && !ASPECTS[doc.aspect]) err("SCHEMA_ENUM", "aspect", "aspect는 " + Object.keys(ASPECTS).join(", ") + " 중 하나여야 합니다.");
    if (doc.sensorLongMm !== undefined && (!isNum(doc.sensorLongMm) || doc.sensorLongMm <= 0)) err("SCHEMA_TYPE", "sensorLongMm", "sensorLongMm은 양수여야 합니다.");
    if (doc.panelsPerPage !== undefined && !isNum(doc.panelsPerPage)) err("SCHEMA_TYPE", "panelsPerPage", "panelsPerPage는 숫자여야 합니다.");
    else if (doc.panelsPerPage !== undefined && (doc.panelsPerPage < 1 || doc.panelsPerPage > 4 || doc.panelsPerPage !== Math.round(doc.panelsPerPage))) err("SCHEMA_RANGE", "panelsPerPage", "panelsPerPage는 1~4의 정수여야 합니다.");
    if (doc.style !== undefined && !isStr(doc.style)) err("SCHEMA_TYPE", "style", "style은 비어 있지 않은 문자열이어야 합니다.");
    if (!isArr(doc.characters) || !doc.characters.length) err("SCHEMA_REQUIRED", "characters", "characters 배열이 하나 이상 필요합니다.");
    else {
      var charIds = {};
      doc.characters.forEach(function (ch, i) {
        var p = "characters[" + i + "]";
        if (!isObj(ch)) { err("SCHEMA_TYPE", p, "인물은 객체여야 합니다."); return; }
        if (!isStr(ch.id)) err("SCHEMA_REQUIRED", p + ".id", "인물 id가 필요합니다.");
        else if (charIds[ch.id]) err("SCHEMA_DUPLICATE", p + ".id", "인물 id가 중복되었습니다: " + ch.id);
        else charIds[ch.id] = true;
        if (!isStr(ch.name)) err("SCHEMA_REQUIRED", p + ".name", "인물 name이 필요합니다.");
        if (ch.heightM !== undefined && !isNum(ch.heightM)) err("SCHEMA_TYPE", p + ".heightM", "heightM은 숫자여야 합니다.");
        if (ch.look !== undefined && !isStr(ch.look)) err("SCHEMA_TYPE", p + ".look", "look은 비어 있지 않은 문자열이어야 합니다.");
      });
    }
    if (!isArr(doc.scenes) || !doc.scenes.length) err("SCHEMA_REQUIRED", "scenes", "scenes 배열이 하나 이상 필요합니다.");
    else {
      var sceneIds = {};
      doc.scenes.forEach(function (scene, si) {
        var sp = "scenes[" + si + "]";
        if (!isObj(scene)) { err("SCHEMA_TYPE", sp, "씬은 객체여야 합니다."); return; }
        if (!isStr(scene.id)) err("SCHEMA_REQUIRED", sp + ".id", "씬 id가 필요합니다.");
        else if (sceneIds[scene.id]) err("SCHEMA_DUPLICATE", sp + ".id", "씬 id가 중복되었습니다: " + scene.id);
        else sceneIds[scene.id] = true;
        if (!isNum(scene.number)) err("SCHEMA_REQUIRED", sp + ".number", "씬 number가 필요합니다.");
        if (!isStr(scene.heading)) err("SCHEMA_REQUIRED", sp + ".heading", "씬 heading이 필요합니다.");
        if (!isArr(scene.props)) err("SCHEMA_REQUIRED", sp + ".props", "props 배열이 필요합니다(비어 있어도 됩니다).");
        else {
          var propIds = {};
          scene.props.forEach(function (prop, pi) {
            var pp = sp + ".props[" + pi + "]";
            if (!isObj(prop)) { err("SCHEMA_TYPE", pp, "소품은 객체여야 합니다."); return; }
            if (!isStr(prop.id)) err("SCHEMA_REQUIRED", pp + ".id", "소품 id가 필요합니다.");
            else if (propIds[prop.id]) err("SCHEMA_DUPLICATE", pp + ".id", "소품 id가 중복되었습니다: " + prop.id);
            else propIds[prop.id] = true;
            if (!isStr(prop.label)) err("SCHEMA_REQUIRED", pp + ".label", "소품 label이 필요합니다.");
            ["x", "z", "w", "d", "h"].forEach(function (k) {
              if (!isNum(prop[k])) err("SCHEMA_REQUIRED", pp + "." + k, "소품 " + k + " 값이 필요합니다.");
            });
            if (prop.y !== undefined) {
              if (!isNum(prop.y)) err("SCHEMA_TYPE", pp + ".y", "소품 y는 숫자여야 합니다.");
              else if (prop.y < 0) err("SCHEMA_RANGE", pp + ".y", "소품 y는 0 이상이어야 합니다.");
            }
          });
        }
        if (!isArr(scene.blocking)) err("SCHEMA_REQUIRED", sp + ".blocking", "blocking 배열이 필요합니다.");
        else {
          var blocked = {};
          scene.blocking.forEach(function (b, bi) {
            var bp = sp + ".blocking[" + bi + "]";
            if (!isObj(b)) { err("SCHEMA_TYPE", bp, "블로킹은 객체여야 합니다."); return; }
            if (!isStr(b.character) || !charOf(doc, b.character)) err("SCHEMA_REFERENCE", bp + ".character", "블로킹 인물을 찾을 수 없습니다.");
            else if (blocked[b.character]) err("SCHEMA_DUPLICATE", bp + ".character", "블로킹이 중복되었습니다: " + b.character);
            else blocked[b.character] = true;
            if (!isNum(b.x) || !isNum(b.z)) err("SCHEMA_REQUIRED", bp, "블로킹 x, z가 필요합니다.");
            if (!isNum(b.facingDeg)) err("SCHEMA_REQUIRED", bp + ".facingDeg", "facingDeg가 필요합니다.");
            if (POSE_ENUM.indexOf(b.pose) < 0) err("SCHEMA_ENUM", bp + ".pose", "pose는 " + POSE_ENUM.join(", ") + " 중 하나여야 합니다.");
          });
        }
        if (scene.axis === undefined) err("SCHEMA_REQUIRED", sp + ".axis", "axis가 필요합니다(null 또는 인물 id 두 개).");
        else if (scene.axis === null) { /* null is the documented no-line value */ }
        else if (!isArr(scene.axis) || scene.axis.length !== 2) err("SCHEMA_TYPE", sp + ".axis", "axis는 인물 id 두 개의 배열이거나 null이어야 합니다.");
        else {
          scene.axis.forEach(function (id, ai) {
            if (!isStr(id) || !charOf(doc, id)) err("SCHEMA_REFERENCE", sp + ".axis[" + ai + "]", "축 인물을 찾을 수 없습니다: " + id);
          });
        }
        if (!isArr(scene.shots) || !scene.shots.length) err("SCHEMA_REQUIRED", sp + ".shots", "shots 배열이 하나 이상 필요합니다.");
        else {
          var shotIds = {};
          scene.shots.forEach(function (shot, hi) {

      });
    }
    if (!errors.length) {
      doc.scenes.forEach(function (scene, si) {
        scene.shots.forEach(function (shot, hi) {
          geometryErrors(doc, scene, shot).forEach(function (message) {
            err("CAMERA_GEOMETRY", "scenes[" + si + "].shots[" + hi + "].camera", message);
          });
        });
      });
    }
    if (!errors.length) info = horizonInfo(doc);
    return { errors: errors, info: info };
  }

  function validateShot(shot, hp, scene, doc, shotIds, err) {
    if (!isObj(shot)) { err("SCHEMA_TYPE", hp, "샷은 객체여야 합니다."); return; }
    if (!isStr(shot.id)) err("SCHEMA_REQUIRED", hp + ".id", "샷 id가 필요합니다.");
    else if (shotIds[shot.id]) err("SCHEMA_DUPLICATE", hp + ".id", "샷 id가 씬 안에서 중복되었습니다: " + shot.id);
    else shotIds[shot.id] = true;
    if (!isStr(shot.size)) err("SCHEMA_REQUIRED", hp + ".size", "샷 size가 필요합니다.");
    else if (SIZE_ENUM.indexOf(shot.size) < 0) err("SCHEMA_ENUM", hp + ".size", "size는 " + SIZE_ENUM.join(", ") + " 중 하나여야 합니다.");
    if (!isStr(shot.focus)) err("SCHEMA_REQUIRED", hp + ".focus", "focus가 필요합니다.");
    else if (!charOf(doc, shot.focus) && !propOf(scene, shot.focus)) err("SCHEMA_REFERENCE", hp + ".focus", "초점 대상을 찾을 수 없습니다: " + shot.focus);
    if (shot.subjects !== undefined && shot.subjects !== null) {
      if (!isArr(shot.subjects)) err("SCHEMA_TYPE", hp + ".subjects", "subjects는 배열이어야 합니다.");
      else shot.subjects.forEach(function (id, i) {
        if (!isStr(id) || !charOf(doc, id)) err("SCHEMA_REFERENCE", hp + ".subjects[" + i + "]", "subjects 인물을 찾을 수 없습니다: " + id);
      });
    }
    if (!isObj(shot.camera)) { err("SCHEMA_REQUIRED", hp + ".camera", "camera 객체가 필요합니다."); }
    else {
      var cp = hp + ".camera", cam = shot.camera;
      if (cam.focalMm === undefined || cam.focalMm === null) err("SCHEMA_REQUIRED", cp + ".focalMm", "focalMm이 필요합니다.");
      else if (!isNum(cam.focalMm)) err("SCHEMA_TYPE", cp + ".focalMm", "focalMm은 숫자여야 합니다.");
      else if (cam.focalMm < 10 || cam.focalMm > 300) err("SCHEMA_RANGE", cp + ".focalMm", "focalMm은 10~300mm여야 합니다.");
      if (cam.yawDeg === undefined || cam.yawDeg === null) err("SCHEMA_REQUIRED", cp + ".yawDeg", "yawDeg가 필요합니다.");
      else if (!isNum(cam.yawDeg)) err("SCHEMA_TYPE", cp + ".yawDeg", "yawDeg는 숫자여야 합니다.");
      else if (cam.yawDeg < -180 || cam.yawDeg > 180) err("SCHEMA_RANGE", cp + ".yawDeg", "yawDeg는 -180~180도여야 합니다.");
      if (cam.rollDeg === undefined || cam.rollDeg === null) err("SCHEMA_REQUIRED", cp + ".rollDeg", "rollDeg가 필요합니다.");
      else if (!isNum(cam.rollDeg)) err("SCHEMA_TYPE", cp + ".rollDeg", "rollDeg는 숫자여야 합니다.");
      else if (cam.rollDeg < -45 || cam.rollDeg > 45) err("SCHEMA_RANGE", cp + ".rollDeg", "rollDeg는 -45~45도여야 합니다.");
      if (cam.pitchDeg !== undefined && cam.pitchDeg !== null) {
        if (!isNum(cam.pitchDeg)) err("SCHEMA_TYPE", cp + ".pitchDeg", "pitchDeg는 숫자여야 합니다.");
        else if (cam.pitchDeg < -90 || cam.pitchDeg > 90) err("SCHEMA_RANGE", cp + ".pitchDeg", "pitchDeg는 -90~90도여야 합니다.");
      }
      if (cam.heightM !== undefined && cam.heightM !== null) {
        if (!isNum(cam.heightM)) err("SCHEMA_TYPE", cp + ".heightM", "heightM은 숫자여야 합니다.");
        else if (cam.heightM < 0.05 || cam.heightM > 50) err("SCHEMA_RANGE", cp + ".heightM", "heightM은 0.05~50m여야 합니다.");
      }
      if (cam.distanceM !== undefined && cam.distanceM !== null && !isNum(cam.distanceM)) err("SCHEMA_TYPE", cp + ".distanceM", "distanceM은 숫자여야 합니다.");
      if (cam.pov !== undefined && cam.pov !== null && !isStr(cam.pov)) err("SCHEMA_TYPE", cp + ".pov", "pov는 인물 id여야 합니다.");
      if (cam.over !== undefined && cam.over !== null && !isStr(cam.over)) err("SCHEMA_TYPE", cp + ".over", "over는 인물 id여야 합니다.");
      if (isStr(cam.pov) && !charOf(doc, cam.pov)) err("SCHEMA_REFERENCE", cp + ".pov", "pov 인물을 찾을 수 없습니다: " + cam.pov);
      if (isStr(cam.over) && !charOf(doc, cam.over)) err("SCHEMA_REFERENCE", cp + ".over", "over 인물을 찾을 수 없습니다: " + cam.over);
      if (isNum(cam.pitchDeg) && isNum(cam.heightM)) err("SCHEMA_CONFLICT", cp, "pitchDeg와 heightM은 함께 쓸 수 없습니다.");
      if (isStr(cam.pov)) {
        if (isNum(cam.pitchDeg) || isNum(cam.heightM) || isNum(cam.distanceM)) err("SCHEMA_CONFLICT", cp, "pov 샷에는 pitchDeg, heightM, distanceM을 쓸 수 없습니다.");
        if (shot.size === "OTS") err("SCHEMA_CONFLICT", cp, "pov와 size OTS는 함께 쓸 수 없습니다.");
      }
      if (shot.size === "OTS") {
        if (!isStr(cam.over)) err("SCHEMA_REQUIRED", cp + ".over", "OTS 샷에는 over 인물이 필요합니다.");
        else if (isNum(cam.pitchDeg) || isNum(cam.heightM) || isNum(cam.distanceM)) err("SCHEMA_CONFLICT", cp, "OTS 샷에는 pitchDeg, heightM, distanceM을 쓸 수 없습니다.");
      } else if (isStr(cam.over)) {
        err("SCHEMA_TYPE", cp + ".over", "over는 size가 OTS일 때만 쓸 수 있습니다.");
      }
    }
    if (shot.move === undefined) err("SCHEMA_REQUIRED", hp + ".move", "move가 필요합니다(null 또는 객체).");
    else if (shot.move === null) { /* no camera move */ }
    else if (!isObj(shot.move)) err("SCHEMA_TYPE", hp + ".move", "move는 객체이거나 null이어야 합니다.");
    else {
      var mp = hp + ".move";
      if (!isStr(shot.move.type)) err("SCHEMA_REQUIRED", mp + ".type", "move.type이 필요합니다.");
      else if (MOVE_ENUM.indexOf(shot.move.type) < 0) err("SCHEMA_ENUM", mp + ".type", "move.type이 목록에 없습니다: " + shot.move.type);
      if (shot.move.endSize !== undefined && shot.move.endSize !== null) {
        if (SIZE_ENUM.indexOf(shot.move.endSize) < 0) err("SCHEMA_ENUM", mp + ".endSize", "endSize가 size 목록에 없습니다.");
      } else if (isStr(shot.move.type) && (IN_MOVES[shot.move.type] || OUT_MOVES[shot.move.type])) {
        err("SCHEMA_REQUIRED", mp + ".endSize", shot.move.type + "에는 endSize가 필요합니다.");
      }
      if (shot.move.primary !== undefined && typeof shot.move.primary !== "boolean") err("SCHEMA_TYPE", mp + ".primary", "primary는 true 또는 false여야 합니다.");
    }
    if (shot.subjectMoves === undefined || shot.subjectMoves === null) err("SCHEMA_REQUIRED", hp + ".subjectMoves", "subjectMoves 배열이 필요합니다(비어 있어도 됩니다).");
    else if (!isArr(shot.subjectMoves)) err("SCHEMA_TYPE", hp + ".subjectMoves", "subjectMoves는 배열이어야 합니다.");
    else {
      shot.subjectMoves.forEach(function (m, mi) {
        var xp = hp + ".subjectMoves[" + mi + "]";
        if (!isObj(m)) { err("SCHEMA_TYPE", xp, "인물 이동은 객체여야 합니다."); return; }
        if (!isStr(m.character) || !charOf(doc, m.character)) err("SCHEMA_REFERENCE", xp + ".character", "이동 인물을 찾을 수 없습니다.");
        if (!isObj(m.to) || !isNum(m.to.x) || !isNum(m.to.z)) err("SCHEMA_REQUIRED", xp + ".to", "to의 x, z가 필요합니다.");
        if (!isStr(m.label)) err("SCHEMA_REQUIRED", xp + ".label", "이동 label이 필요합니다.");
        if (m.primary !== undefined && typeof m.primary !== "boolean") err("SCHEMA_TYPE", xp + ".primary", "primary는 true 또는 false여야 합니다.");
      });
    }
    if (shot.blockingOverride !== undefined && shot.blockingOverride !== null) {
      if (!isArr(shot.blockingOverride)) err("SCHEMA_TYPE", hp + ".blockingOverride", "blockingOverride는 배열이어야 합니다.");
      else shot.blockingOverride.forEach(function (b, bi) {
        var bp = hp + ".blockingOverride[" + bi + "]";
        if (!isObj(b)) { err("SCHEMA_TYPE", bp, "블로킹은 객체여야 합니다."); return; }
        if (!isStr(b.character) || !charOf(doc, b.character)) err("SCHEMA_REFERENCE", bp + ".character", "블로킹 인물을 찾을 수 없습니다.");
        if (!isNum(b.x) || !isNum(b.z)) err("SCHEMA_REQUIRED", bp, "블로킹 x, z가 필요합니다.");
        if (!isNum(b.facingDeg)) err("SCHEMA_REQUIRED", bp + ".facingDeg", "facingDeg가 필요합니다.");
        if (POSE_ENUM.indexOf(b.pose) < 0) err("SCHEMA_ENUM", bp + ".pose", "pose는 " + POSE_ENUM.join(", ") + " 중 하나여야 합니다.");
      });
    }
    if (!isStr(shot.action)) err("SCHEMA_REQUIRED", hp + ".action", "action이 필요합니다.");
    if (shot.dialogue !== undefined && shot.dialogue !== null) {
      if (!isArr(shot.dialogue)) err("SCHEMA_TYPE", hp + ".dialogue", "dialogue는 배열이어야 합니다.");
      else shot.dialogue.forEach(function (d, di) {
        var dp = hp + ".dialogue[" + di + "]";
        if (!isObj(d)) { err("SCHEMA_TYPE", dp, "대사는 객체여야 합니다."); return; }
        if (!isStr(d.speaker)) err("SCHEMA_REQUIRED", dp + ".speaker", "speaker가 필요합니다.");
        if (!isStr(d.line)) err("SCHEMA_REQUIRED", dp + ".line", "대사 line이 필요합니다.");
      });
    }
    if (shot.sound !== undefined && shot.sound !== null && typeof shot.sound !== "string") err("SCHEMA_TYPE", hp + ".sound", "sound는 문자열이어야 합니다.");
    if (shot.image !== undefined && shot.image !== null) {
      var ip = hp + ".image";
      if (!isObj(shot.image)) err("SCHEMA_TYPE", ip, "image는 객체이거나 null이어야 합니다.");
      else {
        if (!isStr(shot.image.src)) err("SCHEMA_REQUIRED", ip + ".src", "image.src가 필요합니다.");
        else if (!IMAGE_SRC_RE.test(shot.image.src)) err("SCHEMA_TYPE", ip + ".src", "image.src는 data:image/png, data:image/jpeg, data:image/webp base64 데이터 URI만 허용합니다.");
        if (!isStr(shot.image.provenance)) err("SCHEMA_REQUIRED", ip + ".provenance", "image.provenance가 필요합니다.");
        else if (PROVENANCE_ENUM.indexOf(shot.image.provenance) < 0) err("SCHEMA_ENUM", ip + ".provenance", "provenance는 " + PROVENANCE_ENUM.join(", ") + " 중 하나여야 합니다.");
        if (shot.image.prompt !== undefined && shot.image.prompt !== null && typeof shot.image.prompt !== "string") err("SCHEMA_TYPE", ip + ".prompt", "image.prompt는 문자열이어야 합니다.");
      }
    }
    if (!isNum(shot.durationSec)) err("SCHEMA_REQUIRED", hp + ".durationSec", "durationSec이 필요합니다.");
    else if (shot.durationSec < 0.2 || shot.durationSec > 600) err("SCHEMA_RANGE", hp + ".durationSec", "durationSec은 0.2~600초여야 합니다.");
    if (!isStr(shot.transition)) err("SCHEMA_REQUIRED", hp + ".transition", "transition이 필요합니다.");
    else if (TRANSITION_ENUM.indexOf(shot.transition) < 0) err("SCHEMA_ENUM", hp + ".transition", "transition이 목록에 없습니다.");
    if (shot.crossing === undefined) err("SCHEMA_REQUIRED", hp + ".crossing", "crossing이 필요합니다(null 또는 객체).");
    else if (shot.crossing === null) { /* no crossing */ }
    else if (!isObj(shot.crossing)) err("SCHEMA_TYPE", hp + ".crossing", "crossing은 객체이거나 null이어야 합니다.");
    else {
      var xp2 = hp + ".crossing";
      if (CROSS_ENUM.indexOf(shot.crossing.method) < 0) err("SCHEMA_ENUM", xp2 + ".method", "crossing.method가 목록에 없습니다.");
      if (typeof shot.crossing.intentional !== "boolean") err("SCHEMA_REQUIRED", xp2 + ".intentional", "crossing.intentional이 필요합니다.");
      if (!isStr(shot.crossing.reason)) err("SCHEMA_REQUIRED", xp2 + ".reason", "crossing.reason이 필요합니다.");
    }
    if (!isStr(shot.intent)) err("SCHEMA_REQUIRED", hp + ".intent", "intent가 필요합니다.");
  }

  function geometryErrors(doc, scene, shot) {
    var out = [];
    var cam = shot.camera;
    var box = framingBox(doc, scene, shot, null);
    var vfov = vfovDeg(cam.focalMm, aspectOf(doc), sensorOf(doc));
    var tanV = Math.tan(vfov / 2 * D2R);
    var d = isNum(cam.distanceM) ? cam.distanceM : (box.height / 2) / tanV;
    if (isNum(cam.heightM)) {
      if (Math.abs(cam.heightM - box.center) > d) out.push("카메라 높이 " + fx(cam.heightM, 2) + "m가 프레이밍 중심에서 " + fx(d, 2) + "m보다 멀어 도달할 수 없습니다.");
    }
    if (isNum(cam.pitchDeg)) {
      var h = box.center + d * Math.sin(cam.pitchDeg * D2R);
      if (h < 0.05) out.push("피치 " + fx(cam.pitchDeg, 1) + "°에서 카메라 높이가 " + fx(h, 2) + "m로 바닥 아래입니다.");
    }
    if (isNum(cam.pov) || shot.size === "OTS") {
      var pv = cameraOf(doc, scene, shot);
      if (pv.heightM < 0.05) out.push("눈 위치 카메라가 바닥 아래입니다.");
      if (pv.distanceM < 0.2) out.push("카메라와 초점 대상이 너무 가깝습니다(" + fx(pv.distanceM, 2) + "m).");
    }
    return out;
  }

  function horizonInfo(doc) {
    var info = [];
    doc.scenes.forEach(function (scene, si) {
      if (!isArr(scene.shots)) return;
      scene.shots.forEach(function (shot, hi) {
        if (!isObj(shot) || !isObj(shot.camera) || !isNum(shot.camera.focalMm)) return;
        var cam = cameraOf(doc, scene, shot);
        if (!cam.horizonVisible) {
          info.push(issue("HORIZON_OFFFRAME", "scenes[" + si + "].shots[" + hi + "]",
            "피치 " + fx(cam.pitchDeg, 1) + "°가 세로화각의 절반(" + fx(cam.vfovDeg / 2, 2) + "°)을 넘어 지평선이 프레임 밖입니다."));
        }
      });
    });
    return info;
  }

  // ------------------------------------------------------------------ layout
  function layoutShot(doc, sceneId, shotId) {
    var scene = findScene(doc, sceneId);
    var shot = findShot(scene, shotId);
    if (!scene || !shot) return null;
    var cam = cameraOf(doc, scene, shot);
    return {
      cameraPos: { x: round3(cam.camPos.x), y: round3(cam.camPos.y), z: round3(cam.camPos.z) },
      target: { x: round3(cam.target.x), y: round3(cam.target.y), z: round3(cam.target.z) },
      pitchDeg: round3(cam.pitchDeg),
      heightM: round3(cam.heightM),
      distanceM: round3(cam.distanceM),

      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
    });
    if (maxX - minX < 0.5) { minX -= 0.25; maxX += 0.25; }
    if (maxZ - minZ < 0.5) { minZ -= 0.25; maxZ += 0.25; }
    var scale = Math.min((W - pad * 2) / (maxX - minX), (H - pad * 2) / (maxZ - minZ));
    function sx(x) { return pad + (x - minX) * scale; }
    function sz(z) { return H - pad - (z - minZ) * scale; }
    function facingDir(deg) { return { x: Math.sin(deg * D2R), z: Math.cos(deg * D2R) }; }
    var out = [];
    var labels = [];
    out.push('<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(scene.heading) + ' 평면도">');
    out.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fff" stroke="#111" stroke-width="2"/>');
    if (isArr(scene.axis) && scene.axis.length === 2) {
      var a1 = null, a2 = null;
      (scene.blocking || []).forEach(function (b) {
        if (b.character === scene.axis[0]) a1 = b;
        if (b.character === scene.axis[1]) a2 = b;
      });
      if (a1 && a2) {
        var dxa = numOr(a2.x, 0) - numOr(a1.x, 0), dza = numOr(a2.z, 0) - numOr(a1.z, 0);
        var la = Math.hypot(dxa, dza) || 1;
        var ex = dxa / la * 0.9 * Math.min((W - pad * 2) / scale, (H - pad * 2) / scale);
        var ez = dza / la * 0.9 * Math.min((W - pad * 2) / scale, (H - pad * 2) / scale);
        out.push('<line data-part="axis" x1="' + fx(sx(numOr(a1.x, 0) - ex), 1) + '" y1="' + fx(sz(numOr(a1.z, 0) - ez), 1) + '" x2="' + fx(sx(numOr(a2.x, 0) + ex), 1) + '" y2="' + fx(sz(numOr(a2.z, 0) + ez), 1) + '" stroke="#3a6ea5" stroke-width="1.4" stroke-dasharray="10 8" vector-effect="non-scaling-stroke"/>');
      }
    }
    if (isArr(scene.props)) {
      scene.props.forEach(function (p) {
        var w = numOr(p.w, 1), d = numOr(p.d, 1);
        var x = sx(numOr(p.x, 0) - w / 2), y = sz(numOr(p.z, 0) + d / 2);
        out.push('<rect data-part="prop" x="' + fx(x, 1) + '" y="' + fx(y, 1) + '" width="' + fx(w * scale, 1) + '" height="' + fx(d * scale, 1) + '" fill="#f2efe8" stroke="#111" stroke-width="1.2" vector-effect="non-scaling-stroke"/>');
        labels.push({ text: esc(p.label), x: x + w * scale / 2, y: y + d * scale / 2 + 6, anchor: "middle" });
      });
    }
    if (isArr(scene.blocking)) {
      scene.blocking.forEach(function (b) {
        var ch = charOf(doc, b.character);
        if (!ch) return;
        var x = sx(numOr(b.x, 0)), y = sz(numOr(b.z, 0));
        var dir = facingDir(numOr(b.facingDeg, 0));
        out.push('<circle data-part="blocking" cx="' + fx(x, 1) + '" cy="' + fx(y, 1) + '" r="11" fill="#fff" stroke="#111" stroke-width="2" vector-effect="non-scaling-stroke"/>');
        out.push('<line x1="' + fx(x, 1) + '" y1="' + fx(y, 1) + '" x2="' + fx(x + dir.x * 24, 1) + '" y2="' + fx(y - dir.z * 24, 1) + '" stroke="#111" stroke-width="2" vector-effect="non-scaling-stroke"/>');
        labels.push({ text: esc(ch.name), x: x, y: y - 18, anchor: "middle" });
      });
    }
    {
      cams.forEach(function (entry) {
        var shot = entry.shot, cam = entry.cam;
        try {
          var cx = sx(cam.camPos.x), cy = sz(cam.camPos.z);
          var tx = sx(cam.target.x), ty = sz(cam.target.z);
          var ang = Math.atan2(ty - cy, tx - cx);
          var back = ang + Math.PI;
          var size = 13;
          var p1 = { x: cx + Math.cos(ang) * size * 1.6, y: cy + Math.sin(ang) * size * 1.6 };
          var p2 = { x: cx + Math.cos(back + 0.5) * size, y: cy + Math.sin(back + 0.5) * size };
          var p3 = { x: cx + Math.cos(back - 0.5) * size, y: cy + Math.sin(back - 0.5) * size };
          var hfov = Math.atan(cam.tanH) * R2D;
          out.push('<path data-part="camera" d="M' + fx(p1.x, 1) + " " + fx(p1.y, 1) + " L" + fx(p2.x, 1) + " " + fx(p2.y, 1) + " L" + fx(p3.x, 1) + " " + fx(p3.y, 1) + ' Z" fill="#c0392b" opacity="0.85"/>');
          out.push('<path d="M' + fx(cx, 1) + " " + fx(cy, 1) + " L" + fx(cx + Math.cos(ang - hfov / 2 * D2R) * size * 6, 1) + " " + fx(cy + Math.sin(ang - hfov / 2 * D2R) * size * 6, 1) + " L" + fx(cx + Math.cos(ang + hfov / 2 * D2R) * size * 6, 1) + " " + fx(cy + Math.sin(ang + hfov / 2 * D2R) * size * 6, 1) + ' Z" fill="#c0392b" opacity="0.08" stroke="#c0392b" stroke-width="0.8" vector-effect="non-scaling-stroke"/>');
          labels.push({ text: esc(shot.id), x: cx + Math.cos(ang) * 36, y: cy + Math.sin(ang) * 36 + 6, anchor: "middle" });
        } catch (error) { /* a shot that cannot be laid out is already reported as an error */ }
      });
    }
    out.push(placePlanLabels(labels, W, H));
    out.push("</svg>");
    return out.join("");
  }

  function placePlanLabels(items, W, H) {
    var placed = [], chunks = [], offsets = [0, -18, 18, -36, 36, -54, 54, -72, 72];
    items.forEach(function (item) {
      var w = Math.max(20, item.text.length * 9), h = 16;
      var left = clamp(item.x - (item.anchor === "middle" ? w / 2 : 0), 4, Math.max(4, W - w - 4));
      var y = clamp(item.y, 16, H - 6);
      for (var k = 0; k < offsets.length; k++) {
        y = clamp(item.y + offsets[k], 16, H - 6);
        var hit = false;
        for (var j = 0; j < placed.length; j++) {
          var p = placed[j];
          if (Math.abs((p.x + p.w / 2) - (left + w / 2)) < (p.w + w) / 2 - 2 && Math.abs(p.y - y) < (p.h + h) / 2) { hit = true; break; }
        }
        if (!hit) break;
      }
      placed.push({ x: left, y: y, w: w, h: h });
      chunks.push('<text class="hint-text" x="' + fx(left + w / 2, 1) + '" y="' + fx(y, 1) + '" text-anchor="middle">' + item.text + "</text>");
    });
    return chunks.join("");
  }

  // ------------------------------------------------------------------ render
  function render(doc) {
    var v = validate(doc);
    if (v.errors.length) return "";
    var l = lint(doc);
    var byPath = {};
    l.warnings.forEach(function (w) {
      byPath[w.path] = byPath[w.path] || [];
      byPath[w.path].push(w.code);
    });
    var per = clamp(Math.round(perPageOf(doc)), 1, 4);
    var out = [];
    var totalPanels = 0;
    doc.scenes.forEach(function (scene, si) {
      var plan = floorPlanSvg(doc, scene);
      out.push('<section class="scene-board" data-scene="' + esc(scene.id) + '">');
      out.push("<h2>SC " + esc(scene.number) + " · " + esc(scene.heading) + "</h2>");
      if (plan) out.push('<figure class="floorplan">' + plan + "<figcaption>SC " + esc(scene.number) + " 평면도 · 빨간 삼각형이 샷 카메라, 점선이 180도 축입니다.</figcaption></figure>");
      var pages = [];
      for (var i = 0; i < scene.shots.length; i += per) pages.push(scene.shots.slice(i, i + per));
      pages.forEach(function (group, pi) {
        var cards = group.map(function (shot) {
          var hi = scene.shots.indexOf(shot);
          totalPanels++;
          return panelHtml(doc, scene, shot, byPath["scenes[" + si + "].shots[" + hi + "]"] || []);
        });
        out.push('<section class="page" style="--per-page:' + per + '">');
        out.push('<header class="page-head"><span>' + esc(doc.title) + "</span><span>SC " + esc(scene.number) + " · " + (pi + 1) + "/" + pages.length + "</span></header>");
        out.push('<div class="panel-grid">' + cards.join("") + "</div>");
        out.push("</section>");
      });
      out.push("</section>");
    });
    return out.join("\n");
  }

  function renderPanelSvg(doc, sceneId, shotId) {
    var scene = findScene(doc, sceneId);
    var shot = findShot(scene, shotId);
    if (!scene || !shot) return "";
    return buildPanel(doc, scene, shot, cameraOf(doc, scene, shot));
  }

  // ------------------------------------------------------- image hand-off
  function styleOf(doc) { return isStr(doc.style) ? doc.style : DEFAULT_STYLE; }
  function degText(v) { return String(Math.round(v * 10) / 10); }
  function sentence(text) { return String(text == null ? "" : text).trim().replace(/[.。\s]+$/, ""); }

  function frameCharacters(doc, scene, shot) {
    var ids = [shot.focus].concat(subjectsOf(doc, scene, shot));
    if (shot.size === "OTS" && isObj(shot.camera) && isStr(shot.camera.over)) ids.push(shot.camera.over);
    var seen = {}, list = [];
    ids.forEach(function (id) {
      var ch = charOf(doc, id);
      if (ch && !seen[ch.id]) { seen[ch.id] = true; list.push(ch); }
    });
    return list;
  }

  function propsInFrame(scene, view) {
    var list = [];
    if (!isArr(scene.props)) return list;
    scene.props.forEach(function (prop) {
      var p = project(view, {
        x: numOr(prop.x, 0),
        y: numOr(prop.y, 0) + numOr(prop.h, 1) / 2,
        z: numOr(prop.z, 0)
      });
      if (p && p.x >= 0 && p.x <= view.W && p.y >= 0 && p.y <= view.H) list.push(prop.label);
    });
    return list;
  }

  // The view clause names what the camera sees of the face, so a profile or a
  // back shot cannot arrive as a plain front view. The side clause only appears
  // where the face can turn: three-quarter and profile views.
  function viewPhrase(yawName, facingScreen) {
    var base = String(yawName).replace(/ [LR]$/, "");
    if (base === "FRONT") return "front view, subject faces the camera";
    if (base === "3/4") return "three-quarter view" + facingSide(facingScreen);
    if (base === "PROFILE") return "profile view (side view)" + facingSide(facingScreen);
    if (base === "3/4 BACK") return "three-quarter back view, face mostly hidden";
    return "back view, subject's face not visible";
  }
  function facingSide(facingScreen) {
    return facingScreen === "center" ? "" : ", subject facing screen-" + facingScreen;
  }

  // One English prompt for an external image generator. Composition is read
  // from the same projection as the panel, so changing a camera value changes
  // the prompt; dialogue is never copied because the art must stay letter-free.
  function compilePanelPrompt(doc, sceneId, shotId) {
    var scene = findScene(doc, sceneId);
    var shot = findShot(scene, shotId);
    if (!scene || !shot) return "";
    var cam = cameraOf(doc, scene, shot);
    var lines = [];
    var isCharacterFocus = !!charOf(doc, shot.focus);
    lines.push("Storyboard panel, " + SIZE_EN[shot.size] +
      (isCharacterFocus ? ", " + viewPhrase(cam.yawName, cam.facingScreen) : "") + ".");
    var roll = numOr(shot.camera.rollDeg, 0);
    var dutch = Math.abs(roll) > 0.05
      ? ", dutch angle, horizon tilted " + degText(Math.abs(roll)) + "° to the " + (roll > 0 ? "right" : "left")
      : "";
    lines.push("Camera " + ANGLE_EN[cam.angleName] + " " + degText(Math.abs(cam.pitchDeg)) + "°, " +
      cam.heightName.toLowerCase() + " height " + fx(cam.heightM, 2) + " m, " + shot.camera.focalMm + "mm lens" + dutch + ".");
    var chars = frameCharacters(doc, scene, shot);
    if (chars.length) {
      var looks = chars.map(function (ch) {
        return ch.look ? ch.name + " (" + sentence(ch.look) + ")" : ch.name;
      }).join("; ");
      lines.push(chars.length > 1 ? chars.length + " characters in frame: " + looks + "." : "Characters: " + looks + ".");
    }
    lines.push("Action: " + sentence(shot.action) + ".");
    var props = propsInFrame(scene, cam.view);
    if (props.length) lines.push("Props in frame: " + props.join(", ") + ".");
    lines.push("Style: " + sentence(styleOf(doc)) + ".");
    lines.push("Do not draw any text, letters, numbers, captions, or speech bubbles in the image.");
    return lines.join(" ");
  }

  // Line-only composition reference: the panel's projection with mannequins,
  // the ground grid and the horizon. No movement arrows, labels, props or notes.
  function renderGuideSvg(doc, sceneId, shotId) {
    var scene = findScene(doc, sceneId);
    var shot = findShot(scene, shotId);
    if (!scene || !shot) return "";
    var cam = cameraOf(doc, scene, shot);
    var view = cam.view;
    var out = [];
    out.push('<svg class="guide-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + view.W + " " + view.H + '" role="img" aria-label="SC ' + esc(scene.number) + " SH " + esc(shot.id) + ' composition guide">');
    out.push('<rect x="0" y="0" width="' + view.W + '" height="' + view.H + '" fill="#fff"/>');
    var grid = groundSegments(view, cam.target);
    if (grid.length) {
      out.push('<g data-part="ground" stroke="#c8c8c8" stroke-width="1" fill="none" vector-effect="non-scaling-stroke">');
      grid.forEach(function (s) {
        out.push('<line x1="' + fx(s[0], 1) + '" y1="' + fx(s[1], 1) + '" x2="' + fx(s[2], 1) + '" y2="' + fx(s[3], 1) + '"/>');
      });
      out.push("</g>");
    }
    if (cam.horizonVisible) {
      var hl = horizonLine(view);
      if (hl) {
        out.push('<line data-part="horizon" x1="' + fx(hl[0], 1) + '" y1="' + fx(hl[1], 1) + '" x2="' + fx(hl[2], 1) + '" y2="' + fx(hl[3], 1) + '" stroke="#b4b4b4" stroke-width="1" stroke-dasharray="14 12" vector-effect="non-scaling-stroke"/>');
      }
    }
    var list = [];
    frameCharacters(doc, scene, shot).forEach(function (ch, i) {
      figureSvg(doc, scene, shot, ch, view, list, i, GUIDE_TONE, "guide-");
    });
    list.sort(function (a, b) { return b.depth - a.depth; });
    list.forEach(function (d) { out.push(d.svg); });
    out.push('<rect data-part="guide-frame" x="0" y="0" width="' + view.W + '" height="' + view.H + '" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>');
    out.push("</svg>");
    return out.join("");
  }

  return {
    validate: validate,
    lint: lint,
    layoutShot: layoutShot,
    renderPanelSvg: renderPanelSvg,
    compilePanelPrompt: compilePanelPrompt,
    renderGuideSvg: renderGuideSvg,
    renderFloorPlanSvg: function (doc, sceneId) {
      var scene = findScene(doc, sceneId);
      return scene ? floorPlanSvg(doc, scene) : "";
    },
    render: render,
    vfovDeg: vfovDeg
  };
})();
</script>
<script id="storyboard-ui">
(function () {
  "use strict";
  var core = window.StoryboardCore;
  var statusEl = document.querySelector("#status");
  var outputEl = document.querySelector("#output");
  var editorEl = document.querySelector("#editor");
  var inputEl = document.querySelector("#input");
  var docEl = document.querySelector("#storyboard-doc");
  var current = null;
  var last = { errors: [], warnings: [], info: [], intentional: [], panels: 0, scenes: 0 };
  var TEMPLATE = {
    version: 1,
    title: "새 스토리보드",
    aspect: "16:9",
    characters: [{ id: "a", name: "인물 A", heightM: 1.7 }],
    scenes: [{
      id: "sc1", number: 1, heading: "INT. 방 - 낮", props: [],
      blocking: [{ character: "a", x: 0, z: 0, facingDeg: 0, pose: "stand" }],
      axis: null,
      shots: [{
        id: "10", size: "MS", focus: "a",
        camera: { yawDeg: 0, rollDeg: 0, focalMm: 50, pitchDeg: 0 },
        move: null, subjectMoves: [],
        action: "무언가를 바라본다.", durationSec: 2, transition: "CUT",
        crossing: null, intent: "인물을 소개한다."
      }]
    }]
  };

  function summary(report) {
    return "패널 " + report.panels + "개 · 씬 " + report.scenes + "개 · 오류 " + report.errors.length +
      " · 경고 " + report.warnings.length + " · 의도적 넘김 " + report.intentional.length;
  }
  function load(doc) {
    current = doc;
    var v = core.validate(doc);
    var l = v.errors.length ? { warnings: [], info: [], intentional: [] } : core.lint(doc);
    outputEl.innerHTML = v.errors.length ? "" : core.render(doc);
    last = {
      errors: v.errors,
      warnings: l.warnings,
      info: l.info,
      intentional: l.intentional,
      panels: outputEl.querySelectorAll("article.panel").length,
      scenes: outputEl.querySelectorAll("section.scene-board").length
    };
    if (v.errors.length) {
      statusEl.dataset.error = "true";
      statusEl.textContent = v.errors[0].code + " · " + v.errors[0].message + " (" + v.errors[0].path + ")";
    } else {
      delete statusEl.dataset.error;
      statusEl.textContent = summary(last);
    }
    return last;
  }
  function getReport() {
    return {
      errors: last.errors, warnings: last.warnings, info: last.info,
      intentional: last.intentional, panels: last.panels, scenes: last.scenes
    };
  }
  function renderCurrent() {
    var doc = current;
    if (!doc) {
      try { doc = JSON.parse(inputEl.value); }
      catch (error) {
        statusEl.dataset.error = "true";
        statusEl.textContent = "JSON을 읽지 못했습니다: " + error.message;
        return getReport();
      }
    }
    return load(doc);
  }

  window.storyboardStudio = Object.freeze({ load: load, getReport: getReport, render: renderCurrent });

  var raw = docEl.textContent.trim();
  if (raw) {
    try {
      var doc = JSON.parse(raw);
      editorEl.hidden = true;
      load(doc);
    } catch (error) {
      statusEl.dataset.error = "true";
      statusEl.textContent = "내장 문서를 읽지 못했습니다: " + error.message;
    }
  } else {
    editorEl.hidden = false;
    inputEl.value = JSON.stringify(TEMPLATE, null, 2);
    statusEl.textContent = "문서를 붙여넣고 렌더를 누르십시오.";
  }

  document.querySelector("#render").addEventListener("click", function () {
    current = null;
    renderCurrent();
  });
})();
</script>
</body>
</html>
